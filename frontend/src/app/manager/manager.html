<div class="p-6">
  <h2 class="text-2xl font-semibold mb-4">Manager Dashboard</h2>

  <table class="table">
    <thead class="bg-gray-100">
      <tr>
        <th class="th">ID</th>
        <th class="th">Customer</th>
        <th class="th">Product</th>
        <th class="th">Status</th>
        <th class="th">Assign</th>
        <th class="th">Close</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of (tickets$ | async)">
        <td class="td">{{ t.id }}</td>
        <td class="td">{{ t.customerName }}</td>
        <td class="td">{{ t.productName }}</td>
        <td class="td">{{ t.status }}</td>
        <td class="td">
          <select #sel (change)="assign(t.id, sel.value)" class="border px-2 py-1 rounded">
            <option value="">Select</option>
            <option *ngFor="let tech of technicians" [value]="tech.id">{{ tech.name }}</option>
          </select>
        </td>
        <td class="td">
          <button (click)="close(t.id)" class="btn bg-green-600">Close</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
