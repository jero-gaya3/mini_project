<div class="max-w-md mx-auto bg-white shadow p-6 rounded">
  <h2 class="text-xl font-bold mb-4">Create Ticket</h2>
  <form (ngSubmit)="submit()">
    <input class="input" placeholder="Customer Name" [(ngModel)]="ticket.customerName" name="customerName" required />
    <input class="input" placeholder="Customer Phone" [(ngModel)]="ticket.customerPhone" name="customerPhone" required />
    <input class="input" placeholder="Product Name" [(ngModel)]="ticket.productName" name="productName" required />
    <textarea class="input" placeholder="Issue Description" [(ngModel)]="ticket.issueDescription" name="issueDescription" required></textarea>
    <select class="input" [(ngModel)]="ticket.priority" name="priority">
      <option>LOW</option>
      <option>MEDIUM</option>
      <option>HIGH</option>
    </select>
    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Submit</button>
    <p *ngIf="message" class="mt-2 text-green-600">{{ message }}</p>
  </form>
</div>
