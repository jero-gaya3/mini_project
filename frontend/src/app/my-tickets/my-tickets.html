<div class="max-w-4xl mx-auto bg-white shadow p-6 rounded">
  <h2 class="text-xl font-bold mb-4">My Tickets</h2>
  <table class="min-w-full border">
    <thead class="bg-gray-100">
      <tr>
        <th class="p-2 border">ID</th>
        <th class="p-2 border">Customer</th>
        <th class="p-2 border">Product</th>
        <th class="p-2 border">Status</th>
        <th class="p-2 border">Priority</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of tickets">
        <td class="border p-2">{{t.id}}</td>
        <td class="border p-2">{{t.customerName}}</td>
        <td class="border p-2">{{t.productName}}</td>
        <td class="border p-2">{{t.status}}</td>
        <td class="border p-2">{{t.priority}}</td>
      </tr>
    </tbody>
  </table>
</div>
